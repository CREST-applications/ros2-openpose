services:
  dev:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        - UID=1000
        - GID=1000
    tty: true
    network_mode: host
    volumes:
      # for mDNS
      - /var/run/dbus:/var/run/dbus
      - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket

      - .:/home/user/ros2_ws
    environment:
      - ROS_DOMAIN_ID=33
      - PLEIADES_HOST=http://desktop.local/api/v0.5/
      - MAX_JOB=5
      - POSE_FPS=10
      - POSE_THRESHOLD=0.45
    working_dir: /home/user/ros2_ws
    command:
      - /bin/bash
      - -c
      - |
        colcon build --symlink-install
        source ./install/setup.bash
        ros2 launch launcher launch.py
